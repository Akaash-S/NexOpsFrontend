name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: TypeScript type checking
        run: pnpm exec tsc --noEmit

      - name: Next.js build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy_api_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: nexops-suite.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: nexops-suite
          NEXT_PUBLIC_FIREBASE_APP_ID: dummy_app_id
